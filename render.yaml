services:
  - type: web
    name: coopnex-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SALT
        generateValue: true
      - key: FRONTEND_URL
        sync: false

