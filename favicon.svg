<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="coopnexGrad" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0A66C2" />
      <stop offset="50%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="12" y1="10" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0A66C2" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="36" y1="10" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#0A66C2" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- Left Figure: Head (Worker / Technology) in COOP BLUE -->
  <circle cx="21" cy="17" r="5.5" fill="url(#blueGrad)" />

  <!-- Right Figure: Head (Customer / Community) in COOP GREEN -->
  <circle cx="43" cy="17" r="5.5" fill="url(#greenGrad)" />

  <!-- Connecting Geometric Loop (Interlocking Nexus Arc) -->
  <!-- Left Body Arc curving into central nexus -->
  <path
    d="M 12,46 C 10,34 16,27 25,27 C 32,27 34,31 40,36 C 45,40 50,38 52,34"
    stroke="url(#blueGrad)"
    strokeWidth="5.5"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- Right Body Arc looping from right side under and linking left -->
  <path
    d="M 52,46 C 54,34 48,27 39,27 C 32,27 30,31 24,36 C 19,40 14,38 12,34"
    stroke="url(#greenGrad)"
    strokeWidth="5.5"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- Central Nexus Connector Loop & Spark in Warm Gold -->
  <circle cx="32" cy="31.5" r="3.2" fill="#F59E0B" />
  <circle cx="32" cy="31.5" r="1.2" fill="#FFFFFF" />
</svg>